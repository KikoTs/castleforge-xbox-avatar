name: Source boundary audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject proprietary or generated files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E -i '(^|/)(CastleMinerZ\.exe|DNA\.[A-Za-z]+\.dll)$|\.(ocavatar|winmd|exe|dll|pdb|lib|exp|obj)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden files are tracked:"
            echo "$forbidden"
            exit 1
          fi
          echo "Source boundary audit passed."

      - name: Reject decompiled game source
        shell: bash
        run: |
          set -euo pipefail
          # The runtime legitimately names game types it calls. What must never
          # appear is the game's own source: a namespace declaration for one of
          # its assemblies means a decompiled file was committed.
          leaked="$(git ls-files -- '*.cs' | xargs -r grep -lE '^\s*namespace\s+(DNA|DNA\.[A-Za-z.]+)\s*$' || true)"
          if [[ -n "$leaked" ]]; then
            echo "These files declare a game namespace, so they are decompiled game source:"
            echo "$leaked"
            exit 1
          fi
          echo "No decompiled game source is tracked."

# There is deliberately no build job. Compiling this mod needs CastleMinerZ.exe,
# DNA.Common.dll, the XNA GAC and CastleForge's loader assemblies, none of which
# may be committed here or fetched in CI. A build job would either need those
# checked in - defeating the audit above - or be a green tick that compiled
# nothing. Building and the four smoke tests run locally through build.ps1,
# against your own install.
