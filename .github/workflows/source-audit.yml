name: Source boundary audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject proprietary or generated files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E -i '(^|/)(CastleMinerZ\.exe|DNA\.[A-Za-z]+\.dll)$|\.(ocavatar|winmd|exe|dll|pdb|lib|exp|obj)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden files are tracked:"
            echo "$forbidden"
            exit 1
          fi
          echo "Source boundary audit passed."

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build setup and probe
        shell: pwsh
        run: |
          dotnet build src/Setup/CastleMinerZAvatarSetup.csproj -c Release
          dotnet build src/Probe/AvatarCompatProbe.csproj -c Release
